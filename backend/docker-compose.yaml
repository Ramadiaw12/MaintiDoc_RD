services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: maintidoc-db
    environment:
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: maintidoc
      POSTGRES_DB: maintidoc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql

  
volumes:
  pgdata: